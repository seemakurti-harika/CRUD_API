services:
  db:
    image: postgres:16
    container_name: task-postgres
    restart: always
    environment:
      POSTGRES_DB: taskdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"

  api:
    build: .
    container_name: task-api
    restart: always
    depends_on:
      - db
    ports:
      - "8000:8000"
    env_file:
      - .env